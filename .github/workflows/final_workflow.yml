name: Build APK with icon (self-contained, one file only)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Находим манифест в репозитории сам (не важно, где именно лежит)
      - name: Find AndroidManifest.xml
        id: findman
        run: |
          MAN=$(find . -name "AndroidManifest.xml" | head -n1)
          if [ -z "$MAN" ]; then echo "Манифест не найден!"; exit 1; fi
          echo "path=$MAN" >> "$GITHUB_OUTPUT"
          echo "Найден: $MAN"

      # 2. Кладём иконку (зашита прямо здесь как base64 — грузить файлы
      #    вручную через GitHub не нужно) в ту же res/, где лежит манифест
      - name: Generate icon into res/drawable
        run: |
          MAN="${{ steps.findman.outputs.path }}"
          RES_DIR=$(dirname "$MAN")/res
          mkdir -p "$RES_DIR/drawable"
          cat > /tmp/icon.b64 << 'ICONEOF'

ICONEOF
          base64 -d /tmp/icon.b64 > "$RES_DIR/drawable/ic_launcher.png"
          echo "Иконка создана: $RES_DIR/drawable/ic_launcher.png"

      # 3. Прописываем android:icon в найденный манифест, если его там
      #    ещё нет — сам текст манифеста больше НИГДЕ руками не трогаем
      - name: Add android:icon to manifest if missing
        run: |
          MAN="${{ steps.findman.outputs.path }}"
          if ! grep -q 'android:icon' "$MAN"; then
            python3 -c "
import re
p = '$MAN'
s = open(p, encoding='utf-8').read()
s = s.replace('<application', '<application\n        android:icon=\"@drawable/ic_launcher\"', 1)
open(p, 'w', encoding='utf-8').write(s)
"
            echo "Добавили android:icon в $MAN"
          else
            echo "android:icon уже есть в манифесте — не трогаем"
          fi
          cat "$MAN"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || (gradle wrapper && chmod +x gradlew)

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xomnia-apk-with-icon
          path: app/build/outputs/apk/release/*.apk
